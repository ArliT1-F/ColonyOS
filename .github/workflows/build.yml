name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore RimWorld reference assemblies
        run: dotnet restore Source/ColonyOS.csproj
      - name: Build RimWorld 1.6 and 1.7
        shell: bash
        run: |
          set +e
          dotnet build Source/ColonyOS.csproj -c Release --no-restore > build.log 2>&1
          status=$?
          cat build.log
          {
            echo '### Dual-target build output'
            echo '```text'
            tail -c 60000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run analytical tests
        run: dotnet run --project Tests/ColonyOS.Analytics.Tests.csproj -c Release
      - name: Verify mod package
        run: python3 scripts/verify_mod.py
      - name: Package installable mod
        run: python3 scripts/package_mod.py
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: ColonyOS-${{ github.sha }}
          path: dist/ColonyOS.zip
          if-no-files-found: error
